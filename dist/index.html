<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="세계 각국의 원어 기사 제목을 매일 모으는 헤드라인 신문.">
<title>World In Words — Headlines</title>
<link rel="stylesheet" href="style.css">
<script src="translation.js" defer></script><script src="news.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#article-list">제목 목록으로 이동</a>
<header><a class="brand" href="./">WIW <span>World In Words</span></a><time id="today"></time><div class="account-nav"><span id="account-name"></span><button id="account-open">로그인 / 가입</button><button id="account-logout" hidden>로그아웃</button></div><p id="update-status" role="status"></p></header>
<div class="layout">
<aside><h2>내 보관함</h2><nav class="library-nav" aria-label="기사 보관함"><button data-view="today" class="selected">오늘의 기사</button><button data-view="history">열람 기록 <span>연도별</span></button><button data-view="scraps">스크랩</button></nav><h2 class="countries-heading">국가·지역</h2><button data-country="all" class="selected">전체</button><nav id="countries" aria-label="국가별 제목"></nav></aside>
<main><form id="search-form" class="search-grid" aria-label="기사 목록 필터"><fieldset><legend>날짜</legend><label><span>시작</span><input id="date-from" type="date" required></label><label><span>종료</span><input id="date-to" type="date" required></label><small>하루–1년</small></fieldset><label>제목<input id="title-search" type="search" placeholder="기사 제목" aria-label="기사 제목 검색"></label><label>국가<select id="country-search" aria-label="국가 선택"></select></label><label>언론사<select id="publisher-search" aria-label="언론사 선택"></select></label><div class="filter-actions"><button type="submit">필터 적용</button><button id="filter-reset" type="button">초기화</button></div></form><p id="search-error" class="search-error" role="alert"></p><div class="tools"><label>순서 <select id="sort" title="여러 언론사의 동시 보도와 Google News 노출 순위를 바탕으로 정렬합니다."><option value="hot">화제순</option><option value="country">국가순</option></select></label><label>번역 언어 <select id="preferred-language" aria-label="기사 제목 번역 언어"></select></label></div>
<div class="heading"><h1 id="section-title">세계의 헤드라인</h1><p id="result-count" aria-live="polite"></p></div>
<p id="library-note" class="library-note" hidden></p><p id="action-status" class="action-status" role="status" aria-live="polite"></p><div id="article-list"></div><button id="more" hidden>제목 더 보기</button></main>
</div>
<footer><p>World In Words</p><button id="back-top">맨 위로</button></footer>
<dialog id="account-dialog" aria-labelledby="account-title">
<div class="dialog-heading"><h2 id="account-title">로그인</h2><button id="account-close" aria-label="닫기">닫기 ×</button></div>
<p>아이디와 비밀번호만으로 나만의 기사 보관함을 만드세요.</p>
<form id="account-form">
<label for="username">아이디</label><input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,24}" minlength="3" maxlength="24" placeholder="영문·숫자·밑줄 3–24자" required>
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="64" placeholder="8자 이상" required>
<label id="confirm-label" for="password-confirm" hidden>비밀번호 확인</label><input id="password-confirm" type="password" autocomplete="new-password" hidden>
<p id="account-error" role="alert"></p><button id="account-submit" type="submit" class="primary">로그인</button>
</form><button id="account-mode">처음이라면 아이디 만들기</button>
<p class="account-help">이메일·전화번호는 받지 않습니다. 비밀번호를 잊으면 복구할 수 없으니 안전하게 보관해주세요.</p>
</dialog>
<noscript>기사 제목을 보려면 JavaScript를 활성화해주세요.</noscript>
</body></html>
